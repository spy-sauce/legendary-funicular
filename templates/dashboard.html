<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mycelium dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════════
   DASHBOARD SCAFFOLD — base layout + canvas chrome
   Consumes: window.__DASHBOARD_STATE__, window.__DASHBOARD_THEME__
   ══════════════════════════════════════════════════════════════════════════════ */

:root {
  /* fallback values — overridden at runtime from theme */
  --ink: #060912;
  --ink-2: #0A0E18;
  --ice: #E8EEF5;
  --ice-2: #A8B4C5;
  --cryo: #7AE5FF;
  --rule: #1A2030;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: var(--ink);
  color: var(--ice);
  height: 100%;
  width: 100%;
  overflow: hidden;
}

body {
  font-family: 'Geist', sans-serif;
  font-size: 12px;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.005em;
  position: relative;
}

/* ── Main frame layout ── */
.frame {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  height: 100%;
  width: 100%;
  min-height: 0;
  min-width: 0;
}

/* ── Stage: canvas container ── */
.stage {
  position: relative;
  overflow: hidden;
  background: var(--ink);
  min-height: 0;
}

#webgl {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Vignette overlay ── */
.vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9997;
  background: radial-gradient(ellipse at center, transparent 38%, rgba(6,9,18,0.7) 100%);
}

/* ── CRT scanlines (subtle) ── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9998;
  opacity: 0.045;
  background: repeating-linear-gradient(0deg, rgba(122,229,255,0.6) 0px, rgba(122,229,255,0.6) 1px, transparent 1px, transparent 3px);
}

/* ── Accent line (top-right diagonal) ── */
.accent-line {
  position: fixed;
  top: 0;
  right: 0;
  width: 280px;
  height: 1px;
  z-index: 9996;
  pointer-events: none;
  background: linear-gradient(90deg, transparent, var(--cryo) 60%, var(--cryo));
  opacity: 0.4;
  transform-origin: right;
  transform: rotate(-22deg) translate(0, 14px);
}

/* ══════════════════════════════════════════════════════════════════════════════
   PLACEHOLDER SECTIONS — other biomes will fill these in
   dashboard-console owns: titlebar, metrics, body (rails), feedbar, feed
   ══════════════════════════════════════════════════════════════════════════════ */

/* titlebar — dashboard-console.titlebar */
.titlebar {
  /* placeholder: dashboard.console.titlebar will implement */
  min-height: 32px;
  background: var(--ink-2);
  border-bottom: 0.5px solid var(--rule);
}

/* metrics strip — dashboard-console.metric-strip */
.metrics {
  /* placeholder: dashboard.console.metric-strip will implement */
  display: none;
}

/* body grid (stage + rails) — dashboard-console handles rails */
.body {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 0;
  overflow: hidden;
}

/* feedbar — dashboard-console.feedbar */
.feedbar {
  /* placeholder: dashboard.console.feedbar will implement */
  min-height: 24px;
  background: var(--ink-2);
  border-top: 0.5px solid var(--rule);
}

/* feed — dashboard-console.event-feed */
.feed {
  /* placeholder: dashboard.console.event-feed will implement */
  display: none;
}

/* ══════════════════════════════════════════════════════════════════════════════
   HUD OVERLAYS — targeting reticle, scan beam, depth readout (focus-conditional)
   Scope: dashboard.canvas.hud-overlays
   ══════════════════════════════════════════════════════════════════════════════ */

/* ── Targeting Reticle: 4 corner brackets converging on focused agent ── */
.target-reticle {
  position: absolute;
  pointer-events: none;
  z-index: 7;
  width: 180px;
  height: 180px;
  opacity: 0;
  transition: opacity 0.4s ease, transform 1.6s cubic-bezier(0.22, 1, 0.36, 1),
              width 1.6s cubic-bezier(0.22, 1, 0.36, 1),
              height 1.6s cubic-bezier(0.22, 1, 0.36, 1);
}

.target-reticle.lock {
  opacity: 1;
}

/* Corner brackets via pseudo-elements + spans */
.target-reticle::before,
.target-reticle::after,
.target-reticle .c1,
.target-reticle .c2 {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  border-color: var(--cryo);
  border-style: solid;
  border-width: 0;
  transition: border-color 0.3s ease;
}

.target-reticle::before { top: 0; left: 0; border-top-width: 1px; border-left-width: 1px; }
.target-reticle::after  { top: 0; right: 0; border-top-width: 1px; border-right-width: 1px; }
.target-reticle .c1     { bottom: 0; left: 0; border-bottom-width: 1px; border-left-width: 1px; }
.target-reticle .c2     { bottom: 0; right: 0; border-bottom-width: 1px; border-right-width: 1px; }

.target-reticle .lbl {
  position: absolute;
  top: -20px;
  left: 0;
  font-family: 'Geist Mono', monospace;
  font-size: 8px;
  color: var(--cryo);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(122, 229, 255, 0.5);
  white-space: nowrap;
}

/* ── Scan Beam: vertical sweep during dive transitions ── */
.scanbeam {
  position: absolute;
  left: 0;
  right: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent 5%, var(--cryo) 30%, var(--cryo) 70%, transparent 95%);
  box-shadow: 0 0 14px var(--cryo), 0 0 30px rgba(122, 229, 255, 0.4);
  z-index: 6;
  pointer-events: none;
  opacity: 0;
  top: 0;
}

.scanbeam.run {
  animation: scanSweep 1.8s cubic-bezier(0.4, 0, 0.6, 1) forwards;
}

@keyframes scanSweep {
  0%   { top: 0%;   opacity: 0; }
  8%   { opacity: 0.95; }
  92%  { opacity: 0.95; }
  100% { top: 100%; opacity: 0; }
}

/* ── Depth HUD Readout: agent.id + state + iter ── */
.depth-hud {
  position: absolute;
  left: 24px;
  bottom: 24px;
  z-index: 5;
  pointer-events: none;
  font-family: 'Geist Mono', monospace;
  font-size: 9px;
  color: var(--ice-2);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1.8;
  opacity: 0;
  transform: translateX(-8px);
  transition: opacity 0.35s ease 0.2s, transform 0.35s ease 0.2s;
}

.depth-hud.show {
  opacity: 1;
  transform: translateX(0);
}

.depth-hud .row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.depth-hud .row .k {
  color: var(--ice-2);
  opacity: 0.7;
}

.depth-hud .row .v {
  color: var(--cryo);
  text-shadow: 0 0 8px rgba(122, 229, 255, 0.5);
}

.depth-hud .lock-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  padding: 4px 10px;
  border: 0.5px solid var(--cryo);
  background: rgba(122, 229, 255, 0.08);
  color: var(--cryo);
  text-shadow: 0 0 8px rgba(122, 229, 255, 0.5);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.depth-hud .lock-badge::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--cryo);
  box-shadow: 0 0 8px var(--cryo);
  animation: cryoBreath 1.4s ease-in-out infinite;
}

@keyframes cryoBreath {
  0%, 100% { opacity: 0.5; transform: scale(0.9); }
  50%      { opacity: 1;   transform: scale(1.1); }
}

</style>

</head>
<body>

<div class="vignette"></div>
<div class="accent-line"></div>

<div class="frame">
  <!-- titlebar: dashboard-console.titlebar will populate -->
  <div class="titlebar" id="titlebar"></div>

  <!-- body: stage (canvas) + rails (dashboard-console) -->
  <div class="body">
    <div class="stage" id="stage">
      <canvas id="webgl"></canvas>

      <!-- ══════════════════════════════════════════════════════════════════════════════
           HUD OVERLAYS — focus-conditional targeting + depth readout
           Scope: dashboard.canvas.hud-overlays
           ══════════════════════════════════════════════════════════════════════════════ -->

      <!-- Targeting reticle: 4 corner brackets, follows focused agent in screen space -->
      <div class="target-reticle" id="target-reticle">
        <span class="c1"></span><span class="c2"></span>

      <!-- Scan beam: vertical sweep during dive (zoom preset transitions) -->

        <div class="row"><span class="k">target</span><span class="v" id="depth-target">—</span></div>
        <div class="row"><span class="k">state</span><span class="v" id="depth-state">—</span></div>
        <div class="row"><span class="k">iter</span><span class="v" id="depth-iter">—</span></div>
        <div class="lock-badge" id="depth-lock">—</div>

      <!-- Other HUD overlays, inspect panel, etc. — dashboard-console -->

  <!-- feedbar: dashboard-console.feedbar will populate -->
  <div class="feedbar" id="feedbar"></div>

  <!-- feed: dashboard-console.event-feed will populate -->
  <div class="feed" id="feed"></div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════════
     CANVAS SCAFFOLD — scene, camera, renderer, resize handler
     Reads: window.__DASHBOARD_STATE__, window.__DASHBOARD_THEME__
     ══════════════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────── State + Theme from server-rendered globals ──────────
// These are inlined by cli/src/lib/dashboard/render.ts before </body>
const STATE = window.__DASHBOARD_STATE__ || {
  organism: { name: 'dashboard-cache', started_at: new Date().toISOString(), iter: 0, view: 'multiverse' },
  agents: [],
  cache: { hits: 0, misses: 0, entries: 0, capacity: 0, recent_keys: [] },
  events: [],
  alerts: [],
  providers: []
};

const THEME = window.__DASHBOARD_THEME__ || {
  brand: { title: 'mycelium', tagline: 'decentralized', logo_char: 'Psi' },
  palette: { ink: '#060912', ink_2: '#0A0E18', ice: '#E8EEF5', ice_2: '#A8B4C5', cryo: '#7AE5FF', rule: '#1A2030' },
  lifecycle: { germ: '#B7A8E8', grow: '#7BC9C0', flow: '#8BB8E0', fruit: '#D9C390', dorm: '#5A6471' },
  severity: { warn: '#D9B85A', alert: '#E08A5C', crit: '#DB5C6E' },
  identity: {},
  modulator: { pending_brightness: 0.3, active_brightness: 1.0, fruit_brightness: 0.9, failed_brightness: 0.45, active_pulse_hz: 0.9 }
};

// Apply theme to CSS custom properties
function applyThemeToCss(theme) {
  const root = document.documentElement;
  root.style.setProperty('--ink', theme.palette.ink);
  root.style.setProperty('--ink-2', theme.palette.ink_2);
  root.style.setProperty('--ice', theme.palette.ice);
  root.style.setProperty('--ice-2', theme.palette.ice_2);
  root.style.setProperty('--cryo', theme.palette.cryo);
  root.style.setProperty('--rule', theme.palette.rule);
}
applyThemeToCss(THEME);

// ────────── Three.js Core Setup ──────────
const stage = document.getElementById('stage');
const canvas = document.getElementById('webgl');

// Scene — transparent background (ink shows through from CSS)
const scene = new THREE.Scene();
scene.background = null;

// Fog — subtle depth cue, color from theme ink
const inkColor = parseInt(THEME.palette.ink.replace('#', ''), 16);
scene.fog = new THREE.FogExp2(inkColor, 0.025);

// Camera — perspective, 42 FOV (matches v9.4 prototype)
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const initialCamPos = new THREE.Vector3(0, 2.5, 16);
camera.position.copy(initialCamPos);

// Renderer — antialiased, alpha, DPR capped at 2
const renderer = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true,
  alpha: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// ────────── Resize Handler ──────────
function fitRenderer() {
  const rect = stage.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;

  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', fitRenderer);
fitRenderer();

// ────────── OrbitControls (basic setup) ──────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableZoom = false;   // custom zoom handler in dashboard.canvas.adaptive-zoom
controls.enablePan = false;
controls.minDistance = 1.5;
controls.maxDistance = 30;
controls.minPolarAngle = 0.02;
controls.maxPolarAngle = Math.PI - 0.02;
controls.target.set(0, 0, 0);

// ────────── Main Group (wraps all product-specific objects) ──────────
// Other canvas leaves (agent-globe, leaves-and-micros, cache-relays, etc.)
// will add their objects to this group or directly to scene.
const mainGroup = new THREE.Group();
scene.add(mainGroup);

// ────────── Globe Wireframe (faint orientation rings) ──────────
const GLOBE_R = 4.6;
{
  const ringGeo = new THREE.TorusGeometry(GLOBE_R, 0.006, 6, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x1F2A3D,
    transparent: true,
    opacity: 0.42
  });

  // Equator ring
  const equator = new THREE.Mesh(ringGeo, ringMat);
  equator.rotation.x = Math.PI / 2;
  mainGroup.add(equator);

  // Two meridian rings
  const meridian1 = new THREE.Mesh(ringGeo, ringMat.clone());
  mainGroup.add(meridian1);

  const meridian2 = new THREE.Mesh(ringGeo, ringMat.clone());
  meridian2.rotation.y = Math.PI / 2;
  mainGroup.add(meridian2);
}

// ────────── Animation Loop ──────────
let animationFrameId = null;

// Animation hook registry — other canvas leaves can register their animation functions
const animationHooks = [];

function animate(time) {
  animationFrameId = requestAnimationFrame(animate);

  // Time in seconds for animation calculations
  const t = time * 0.001;

  // Update controls damping
  controls.update();

  // Run registered animation hooks (agent-globe, leaves-and-micros, cache-relays, etc.)
  animationHooks.forEach(hook => hook(t));

  // Render scene
  renderer.render(scene, camera);
}

// Start animation
animate(0);

// ════════════════════════════════════════════════════════════════════════════════
// AGENT GLOBE — fibonacci-sphere placement + wireframe Bloch rings
// Scope: dashboard.canvas.agent-globe
// Consumes: STATE.agents[], THEME.identity, THEME.modulator
// ════════════════════════════════════════════════════════════════════════════════

const TAU = Math.PI * 2;
const PHI = Math.PI * (Math.sqrt(5) - 1); // Golden angle ~2.399 radians

// ────────── Brightness Modulator by Agent State ──────────
function getBrightnessForState(state, modulator) {
  switch (state) {
    case 'active':  return modulator.active_brightness;
    case 'fruit':   return modulator.fruit_brightness;
    case 'failed':  return modulator.failed_brightness;
    case 'pending':
    case 'dorm':
    default:        return modulator.pending_brightness;
  }
}

// ────────── Color Helper: Apply Brightness to Hex ──────────
function modulateColor(hexColor, brightness) {
  // Parse hex to RGB
  const hex = hexColor.replace('#', '');
  let r = parseInt(hex.substring(0, 2), 16);
  let g = parseInt(hex.substring(2, 4), 16);
  let b = parseInt(hex.substring(4, 6), 16);

  // Apply brightness as a multiplier (clamped)
  r = Math.min(255, Math.round(r * brightness));
  g = Math.min(255, Math.round(g * brightness));
  b = Math.min(255, Math.round(b * brightness));

  return (r << 16) | (g << 8) | b;
}

// ────────── Bloch Ring Factory ──────────
// Creates a wireframe Bloch representation: 3 orthogonal torus rings + central pip
function makeBlochRings(color, opacity = 0.85) {
  const group = new THREE.Group();
  const r = 0.5; // Ring radius

  const ringGeo = new THREE.TorusGeometry(r, 0.005, 6, 64);
  const matBright = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
  const matDim = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity * 0.5 });
  const matMerid2 = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: opacity * 0.35 });

  // Equator ring (XZ plane)
  const equator = new THREE.Mesh(ringGeo, matBright);
  group.add(equator);

  // Meridian 1 (XY plane, rotated 90° around X)
  const meridian1 = new THREE.Mesh(ringGeo, matDim);
  meridian1.rotation.x = Math.PI / 2;
  group.add(meridian1);

  // Meridian 2 (YZ plane, rotated 90° around Y)
  const meridian2 = new THREE.Mesh(ringGeo, matMerid2);
  meridian2.rotation.y = Math.PI / 2;
  group.add(meridian2);

  // Central pip (state indicator)
  const pipMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
  const pip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 14), pipMat);
  group.add(pip);

  // Store materials for later brightness animation
  group.userData = {
    materials: [matBright, matDim, matMerid2, pipMat],
    baseOpacities: [opacity, opacity * 0.5, opacity * 0.35, opacity],
    baseColor: color
  };

  return group;
}

// ────────── Fibonacci Sphere Position Calculator ──────────
function fibonacciSpherePosition(index, total, radius) {
  // Offset index to avoid placing nodes at exact poles
  const y = 1 - (index / (total - 1 || 1)) * 2;
  const ringRadius = Math.sqrt(1 - y * y);
  const theta = PHI * index;

  return new THREE.Vector3(
    Math.cos(theta) * ringRadius,
    y,
    Math.sin(theta) * ringRadius
  ).multiplyScalar(radius);
}

// ────────── Agent Globe Data Structure ──────────
// Maps agent.id -> { group, blochRings, position, state, spin, spinRate }
const agentGlobeData = new Map();

// ────────── Create Agent Bloch Rings ──────────
function createAgentGlobe() {
  const agents = STATE.agents || [];
  const n = agents.length;

  agents.forEach((agent, i) => {
    // Calculate fibonacci sphere position
    const position = fibonacciSpherePosition(i, n, GLOBE_R);

    // Get identity color from theme (fallback to cryo)
    const identityHex = THEME.identity[agent.id] || THEME.palette.cryo;

    // Get brightness for current state
    const brightness = getBrightnessForState(agent.state, THEME.modulator);

    // Modulate color by brightness
    const modulatedColor = modulateColor(identityHex, brightness);

    // Create Bloch rings with modulated color
    const blochRings = makeBlochRings(modulatedColor, 0.85);
    blochRings.position.copy(position);

    // Random spin initialization (visual interest, not state-dependent)
    const spin = Math.random() * TAU;
    const spinRate = (0.08 + Math.random() * 0.06) * (Math.random() < 0.5 ? 1 : -1);

    // Add to main group
    mainGroup.add(blochRings);

    // Store reference for animation
    agentGlobeData.set(agent.id, {
      group: blochRings,
      position: position.clone(),
      basePosition: position.clone(),
      state: agent.state,
      identityHex,
      spin,
      spinRate,
      index: i
    });
  });
}

// ────────── Agent Globe Animation ──────────
// Called each frame from the main animation loop
function animateAgentGlobe(t) {
  const pulseHz = Math.min(THEME.modulator.active_pulse_hz, 1.5); // Clamp to slow-pulse ceiling

  agentGlobeData.forEach((data, agentId) => {
    const { group, state, identityHex, spin, spinRate } = data;

    // Gentle spin animation (all agents)
    group.rotation.y = spin + t * spinRate;
    group.rotation.x = Math.sin(t * 0.15 + data.index) * 0.1;

    // Slow breath pulse for ACTIVE agents only
    if (state === 'active') {
      // sin oscillation: 0.8 to 1.0 brightness range (subtle breath)
      const breathPhase = Math.sin(t * pulseHz * TAU);
      const breathBrightness = 0.9 + breathPhase * 0.1;

      // Update material opacity to create breath effect
      const { materials, baseOpacities } = group.userData;
      materials.forEach((mat, i) => {
        mat.opacity = baseOpacities[i] * breathBrightness;
      });
    }
  });
}

// Initialize agent globe
createAgentGlobe();

// Register agent globe animation hook
animationHooks.push(animateAgentGlobe);

// ════════════════════════════════════════════════════════════════════════════════
// CACHE RELAYS — inner-shell octahedron network at radius 2.6
// Scope: dashboard.canvas.cache-relays
// Consumes: STATE.agents[], THEME.identity["cache-network-store"], agentGlobeData
//
// 4-6 octahedron relay nodes forming an inner cache network shell. Each agent
// edges to its nearest relay; relays form a 2-neighbor mesh among themselves.
// Slow sinusoidal breath animation (0.8 rad/s) — well under the 1.5Hz ceiling.
// ════════════════════════════════════════════════════════════════════════════════

// ────────── Cache Relay Constants ──────────
const CACHE_RELAY_RADIUS = 2.6;  // inner radius vs agent GLOBE_R=4.6
const CACHE_RELAY_COUNT = 5;     // 4-6 relays; 5 for good fibonacci distribution
const CACHE_RELAY_BREATH_RATE = 0.8; // rad/s — under 1.5Hz ceiling

// Color from theme identity, fallback to cyan-teal (#1E9EBF)
const CACHE_RELAY_COLOR_HEX = parseInt(
  (THEME.identity['cache-network-store'] || '#1E9EBF').replace('#', ''),
  16
);
const CACHE_RELAY_COLOR = new THREE.Color(CACHE_RELAY_COLOR_HEX);

// Shared geometry — OctahedronGeometry (faceted look, distinct from agent Bloch rings)
const CACHE_RELAY_GEO = new THREE.OctahedronGeometry(0.18, 0);

// ────────── Cache Relay Data Structures ──────────
const cacheRelayGroup = new THREE.Group();
mainGroup.add(cacheRelayGroup);

// Relay nodes: { id, basePos, wireMesh, fillMesh, haloMesh, wireMat, fillMat, haloMat }
const cacheRelays = [];

// Agent → relay edges: { agentId, relay, line, mat, geo }
const cacheRelayEdges = [];

// Relay → relay mesh edges: { ai, bi, line, mat }
const cacheRelayMesh = [];

// ────────── Create Cache Relay Nodes ──────────
// Fibonacci-distributed on inner sphere at CACHE_RELAY_RADIUS
for (let i = 0; i < CACHE_RELAY_COUNT; i++) {
  // Fibonacci sphere position (same algorithm as agent-globe)
  const basePos = fibonacciSpherePosition(i, CACHE_RELAY_COUNT, CACHE_RELAY_RADIUS);

  // Wireframe octahedron
  const wireMat = new THREE.MeshBasicMaterial({
    color: CACHE_RELAY_COLOR_HEX,
    transparent: true,
    opacity: 0.55,
    wireframe: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const wireMesh = new THREE.Mesh(CACHE_RELAY_GEO, wireMat);
  wireMesh.position.copy(basePos);
  cacheRelayGroup.add(wireMesh);

  // Solid fill (back-face, subtle inner glow)
  const fillMat = new THREE.MeshBasicMaterial({
    color: CACHE_RELAY_COLOR_HEX,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const fillMesh = new THREE.Mesh(CACHE_RELAY_GEO, fillMat);
  fillMesh.position.copy(basePos);
  cacheRelayGroup.add(fillMesh);

  // Soft halo sphere (focus indicator, faint by default)
  const haloMat = new THREE.MeshBasicMaterial({
    color: CACHE_RELAY_COLOR_HEX,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide
  });
  const haloMesh = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), haloMat);
  haloMesh.position.copy(basePos);
  cacheRelayGroup.add(haloMesh);

  cacheRelays.push({
    id: `cache-relay-${i}`,
    basePos: basePos.clone(),
    wireMesh,
    fillMesh,
    haloMesh,
    wireMat,
    fillMat,
    haloMat
  });
}

// ────────── Agent → Nearest Cache Relay Edges ──────────
// Each agent connects to its 3D-nearest relay with a subtle line
agentGlobeData.forEach((agentData, agentId) => {
  let nearestRelay = null;
  let nearestDist = Infinity;

  cacheRelays.forEach(relay => {
    const dist = agentData.basePosition.distanceTo(relay.basePos);
    if (dist < nearestDist) {
      nearestDist = dist;
      nearestRelay = relay;
    }
  });

  if (nearestRelay) {
    // Line geometry from agent position to relay position
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      agentData.basePosition.x, agentData.basePosition.y, agentData.basePosition.z,
      nearestRelay.basePos.x, nearestRelay.basePos.y, nearestRelay.basePos.z
    ], 3));

    const mat = new THREE.LineBasicMaterial({
      color: CACHE_RELAY_COLOR_HEX,
      transparent: true,
      opacity: 0.10,
      blending: THREE.AdditiveBlending
    });

    const line = new THREE.Line(geo, mat);
    cacheRelayGroup.add(line);

    cacheRelayEdges.push({
      agentId,
      relay: nearestRelay,
      line,
      mat,
      geo
    });

    // Store relay reference on agent data for other leaves (pulses, etc.)
    agentData.cacheRelay = nearestRelay;
  }
});

// ────────── Relay → Relay Mesh (2-neighbor connectivity) ──────────
// Each relay connects to its 2 nearest neighbors, avoiding duplicate edges
cacheRelays.forEach((relayA, ai) => {
  // Calculate distances to all other relays
  const distances = cacheRelays
    .map((relayB, bi) => ({
      relay: relayB,
      bi,
      dist: relayA.basePos.distanceTo(relayB.basePos)
    }))
    .filter(x => x.bi !== ai)
    .sort((a, b) => a.dist - b.dist);

  // Connect to 2 nearest neighbors
  distances.slice(0, 2).forEach(({ relay: relayB, bi }) => {
    // Avoid duplicate edges (A→B and B→A)
    const edgeExists = cacheRelayMesh.some(
      e => (e.ai === ai && e.bi === bi) || (e.ai === bi && e.bi === ai)
    );
    if (edgeExists) return;

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      relayA.basePos.x, relayA.basePos.y, relayA.basePos.z,
      relayB.basePos.x, relayB.basePos.y, relayB.basePos.z
    ], 3));

    const mat = new THREE.LineBasicMaterial({
      color: CACHE_RELAY_COLOR_HEX,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending
    });

    const line = new THREE.Line(geo, mat);
    cacheRelayGroup.add(line);

    cacheRelayMesh.push({ ai, bi, line, mat });
  });
});

// ────────── Cache Relay Animation ──────────
// Slow sinusoidal breath (0.8 rad/s) — well under 1.5Hz ceiling
function animateCacheRelays(t) {
  cacheRelays.forEach((relay, ri) => {
    // Slow breath: sin(t * 0.8 + relayIndex * 0.9)
    // 0.8 rad/s ≈ 0.127 Hz — safely under 1.5Hz ceiling
    const breath = (Math.sin(t * CACHE_RELAY_BREATH_RATE + ri * 0.9) + 1) * 0.5;

    // Modulate wireframe opacity (0.55 base + breath variation)
    const baseWireOpacity = 0.55;
    relay.wireMat.opacity = baseWireOpacity + breath * 0.25;

    // Modulate fill opacity (0.10 base + breath variation)
    const baseFillOpacity = 0.10;
    relay.fillMat.opacity = baseFillOpacity + breath * 0.08;

    // Halo: very subtle breath (only visible during focus, handled by other leaves)
    relay.haloMat.opacity = breath * 0.05;

    // Very slow self-rotation (0.18 rad/s)
    relay.wireMesh.rotation.y = t * 0.18 + ri;
    relay.fillMesh.rotation.y = t * 0.18 + ri;

    // Gentle breath scale (1.0 to 1.06)
    const scale = 1.0 + breath * 0.06;
    relay.wireMesh.scale.setScalar(scale);
    relay.fillMesh.scale.setScalar(scale);
  });

  // Relay mesh edges — subtle pulse in unison
  const meshBreath = (Math.sin(t * CACHE_RELAY_BREATH_RATE * 0.7) + 1) * 0.5;
  cacheRelayMesh.forEach(edge => {
    edge.mat.opacity = 0.14 + meshBreath * 0.04;
  });
}

// Register cache relay animation hook
animationHooks.push(animateCacheRelays);

// ════════════════════════════════════════════════════════════════════════════════
// PULSES — slow directional packets on mesh edges
// Scope: dashboard.canvas.pulses
// Three pulse families: routing (agent→agent, 6s), cache-query (leaf→relay, 3s),
// dashflow (agent→leaf, 4s). All ≥ 1.5s traversal per slow-pulse discipline.
// ════════════════════════════════════════════════════════════════════════════════

// ────────── Pulse Duration Constants (all ≥ 1.5s per slow-pulse discipline) ──────────
const ROUTING_PACKET_DURATION = 6.0;   // seconds, agent→agent traversal
const CACHE_PULSE_DURATION = 3.0;      // seconds, leaf→relay traversal
const DASHFLOW_DURATION = 4.0;         // seconds, agent→leaf traversal
const RELAY_DIM_DURATION = 1.6;        // seconds, miss-triggered relay dim decay
const TRAIL_COUNT = 6;                 // trail segments per packet

// ────────── Routing Mesh — edges between agents ──────────
// Build edges for routing packets: each agent connects to 2-3 nearest neighbors
const routingEdges = [];

function buildRoutingEdges() {
  const agents = Array.from(agentGlobeData.values());
  if (agents.length < 2) return;

  // Each agent connects to its 2 nearest neighbors (undirected mesh)
  const edgeSet = new Set();
  agents.forEach((a, ai) => {
    const dists = agents
      .map((b, bi) => ({ b, bi, d: a.position.distanceTo(b.position) }))
      .filter(x => x.bi !== ai)
      .sort((x, y) => x.d - y.d);

    // Connect to 2 nearest
    dists.slice(0, 2).forEach(({ b, bi }) => {
      const key = ai < bi ? `${ai}-${bi}` : `${bi}-${ai}`;
      if (edgeSet.has(key)) return;
      edgeSet.add(key);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute([
        a.position.x, a.position.y, a.position.z,
        b.position.x, b.position.y, b.position.z
      ], 3));
      const mat = new THREE.LineBasicMaterial({
        color: 0x232B3D,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending
      });
      const line = new THREE.Line(geo, mat);
      mainGroup.add(line);
      routingEdges.push({ from: a, to: b, line, mat, geo });
    });
  });
}

buildRoutingEdges();

// ────────── Active Packet Pool ──────────
// All pulse types (routing, cache-query, dashflow) share this array
const activePackets = [];

// ────────── Packet Spawn Helper ──────────
// Creates a trailed particle that travels from startPos to endPos
function spawnPacket(opts) {
  // opts: { type, startPos, endPos, duration, color, onComplete? }
  const trailGroup = new THREE.Group();
  const trail = [];

  for (let i = 0; i < TRAIL_COUNT; i++) {
    const radius = 0.06 - i * 0.007;
    const geo = new THREE.SphereGeometry(radius, 8, 8);
    const mat = new THREE.MeshBasicMaterial({
      color: opts.color,
      transparent: true,
      opacity: 0.95 - i * 0.13,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(opts.startPos);
    trail.push({ mesh, mat, baseOpacity: 0.95 - i * 0.13 });
    trailGroup.add(mesh);
  }

  mainGroup.add(trailGroup);

  activePackets.push({
    type: opts.type,
    trail,
    trailGroup,
    startPos: opts.startPos.clone(),
    endPos: opts.endPos.clone(),
    t: 0,
    duration: opts.duration,
    color: opts.color,
    onComplete: opts.onComplete
  });
}

// ────────── Event Tracking ──────────
// Track processed events to avoid re-spawning packets
const seenEventTs = new Set();       // lifecycle events
const seenCacheEventTs = new Set();  // cache events

// Track relay dim states (relay index → expiry timestamp in seconds)
const relayDimUntil = new Map();

// Track leaf state transitions for dashflow
const prevLeafStates = new Map();

// ────────── Routing Packets — agent→agent, 6s ──────────
// Triggered by lifecycle events in STATE.events
function checkAndSpawnRoutingPackets() {
  if (routingEdges.length === 0) return;

  // Look for recent lifecycle events
  const lifecycleEvents = (STATE.events || []).filter(e => e.category === 'lifecycle');

  lifecycleEvents.forEach(evt => {
    if (seenEventTs.has(evt.ts)) return;
    seenEventTs.add(evt.ts);

    // Pick a random edge to animate (lifecycle events don't specify source/target)
    const edge = routingEdges[Math.floor(Math.random() * routingEdges.length)];
    if (!edge) return;

    // Determine direction randomly
    const reverse = Math.random() < 0.5;
    const start = reverse ? edge.to.position : edge.from.position;
    const end = reverse ? edge.from.position : edge.to.position;

    spawnPacket({
      type: 'routing',
      startPos: start,
      endPos: end,
      duration: ROUTING_PACKET_DURATION,
      color: parseInt(THEME.palette.cryo.replace('#', ''), 16)
    });
  });
}

// ────────── Cache Query Pulses — leaf→relay, 3s ──────────
// Cyan (cryo) for hit, gold (warn) for miss; miss triggers brief relay dim
function checkAndSpawnCachePulses() {
  // Need both cache relays and leaf data
  if (cacheRelays.length === 0) return;

  const cacheEvents = (STATE.events || []).filter(
    e => e.category === 'cache' &&
      (e.short_type === 'cache · hit' || e.short_type === 'cache · miss')
  );

  cacheEvents.forEach(evt => {
    if (seenCacheEventTs.has(evt.ts)) return;
    seenCacheEventTs.add(evt.ts);

    const isHit = evt.short_type === 'cache · hit';
    const color = isHit
      ? parseInt(THEME.palette.cryo.replace('#', ''), 16)
      : parseInt(THEME.severity.warn.replace('#', ''), 16);

    // Find a leaf to spawn from (ideally from evt.source biome)
    let startPos = null;
    const sourceBiomeId = evt.source;

    // Try to find leaf position from leafMeshData (set by leaves-and-micros leaf)
    const leafData = window.__DASHBOARD_CANVAS__?.leafMeshData;

    if (leafData) {
      // Try to find leaf from source biome
      for (const [leafId, lData] of leafData.entries()) {
        if (lData.parentAgentId === sourceBiomeId && lData.state === 'active') {
          const agentData = agentGlobeData.get(sourceBiomeId);
          if (agentData) {
            startPos = lData.position.clone().add(agentData.position);
            break;
          }
        }
      }

      // Fallback: pick any active leaf
      if (!startPos) {
        for (const [leafId, lData] of leafData.entries()) {
          if (lData.state === 'active') {
            const agentData = agentGlobeData.get(lData.parentAgentId);
            if (agentData) {
              startPos = lData.position.clone().add(agentData.position);
              break;
            }
          }
        }
      }
    }

    // Fallback: use random agent position
    if (!startPos && agentGlobeData.size > 0) {
      const agents = Array.from(agentGlobeData.values());
      startPos = agents[Math.floor(Math.random() * agents.length)].position.clone();
    }

    if (!startPos) return;

    // Find nearest relay
    let nearestRelay = null;
    let nearestIdx = 0;
    let nearestDist = Infinity;
    cacheRelays.forEach((relay, idx) => {
      const d = startPos.distanceTo(relay.basePos);
      if (d < nearestDist) {
        nearestDist = d;
        nearestRelay = relay;
        nearestIdx = idx;
      }
    });

    if (!nearestRelay) return;

    // Spawn the pulse
    const relayIdx = nearestIdx;
    spawnPacket({
      type: 'cache',
      startPos: startPos,
      endPos: nearestRelay.basePos.clone(),
      duration: CACHE_PULSE_DURATION,
      color: color,
      onComplete: !isHit ? () => {
        // On miss, trigger relay dim (1.6s decay)
        const now = performance.now() / 1000;
        relayDimUntil.set(relayIdx, now + RELAY_DIM_DURATION);
      } : undefined
    });
  });
}

// ────────── Dashflow Pulses — agent→leaf, 4s ──────────
// Triggered when leaf transitions to 'active' state
function checkAndSpawnDashflowPulses() {
  const leafData = window.__DASHBOARD_CANVAS__?.leafMeshData;
  if (!leafData) return;

  // Check each leaf for active transition
  for (const [leafId, lData] of leafData.entries()) {
    const prevState = prevLeafStates.get(leafId);
    const currState = lData.state;

    if (currState === 'active' && prevState !== 'active') {
      // Leaf just became active — spawn dashflow pulse from parent agent to leaf
      const agentData = agentGlobeData.get(lData.parentAgentId);
      if (agentData) {
        const startPos = agentData.position.clone();
        const endPos = lData.position.clone().add(agentData.position);

        // Color: use parent agent's identity color
        const colorHex = THEME.identity[lData.parentAgentId] || THEME.palette.cryo;
        const color = parseInt(colorHex.replace('#', ''), 16);

        spawnPacket({
          type: 'dashflow',
          startPos: startPos,
          endPos: endPos,
          duration: DASHFLOW_DURATION,
          color: color
        });
      }
    }

    prevLeafStates.set(leafId, currState);
  }
}

// ────────── Apply Relay Dim on Cache Miss ──────────
// Called each frame to modulate relay opacity during miss dim window
function applyRelayDimEffects(t) {
  const nowSec = performance.now() / 1000;

  cacheRelays.forEach((relay, idx) => {
    const dimUntil = relayDimUntil.get(idx);
    if (dimUntil && nowSec < dimUntil) {
      // Calculate remaining dim factor (1.0 at miss arrival → 0.0 at expiry)
      const remaining = (dimUntil - nowSec) / RELAY_DIM_DURATION;
      const dimFactor = 0.5 + remaining * 0.5; // 0.5 to 1.0 (inverted: more dim at start)
      relay.wireMat.opacity *= dimFactor;
      relay.fillMat.opacity *= dimFactor;
    }
  });
}

// ────────── Pulse Animation Loop ──────────
let lastPulseTime = 0;

function animatePulses(t) {
  // Calculate delta time
  const dt = lastPulseTime > 0 ? t - lastPulseTime : 0.016;
  lastPulseTime = t;

  // Check for new packets to spawn
  checkAndSpawnRoutingPackets();
  checkAndSpawnCachePulses();
  checkAndSpawnDashflowPulses();

  // Animate active packets
  for (let i = activePackets.length - 1; i >= 0; i--) {
    const p = activePackets[i];
    p.t += dt / p.duration;

    if (p.t >= 1) {
      // Packet completed
      if (p.onComplete) p.onComplete();
      mainGroup.remove(p.trailGroup);
      activePackets.splice(i, 1);
      continue;
    }

    // Interpolate trail positions along the path
    const tt = p.t;
    p.trail.forEach((seg, idx) => {
      // Stagger trail segments slightly behind the head
      const segT = Math.max(0, tt - idx * 0.012);
      seg.mesh.position.set(
        p.startPos.x * (1 - segT) + p.endPos.x * segT,
        p.startPos.y * (1 - segT) + p.endPos.y * segT,
        p.startPos.z * (1 - segT) + p.endPos.z * segT
      );
      // Fade in then out (sin curve for smooth opacity)
      seg.mat.opacity = seg.baseOpacity * Math.sin(tt * Math.PI);
    });
  }

  // Apply relay dim effects (after cache-relays animation has run)
  applyRelayDimEffects(t);

  // Clean up old seen events (keep last 200 to prevent memory growth)
  if (seenEventTs.size > 300) {
    const arr = Array.from(seenEventTs);
    arr.slice(0, 100).forEach(ts => seenEventTs.delete(ts));
  }
  if (seenCacheEventTs.size > 300) {
    const arr = Array.from(seenCacheEventTs);
    arr.slice(0, 100).forEach(ts => seenCacheEventTs.delete(ts));
  }
}

// Register pulse animation hook
animationHooks.push(animatePulses);

// ════════════════════════════════════════════════════════════════════════════════
// ADAPTIVE ZOOM — three presets + lerp-based wheel rebound
// Scope: dashboard.canvas.adaptive-zoom
// Consumes: camera, controls, renderer, agentGlobeData
//
// Three presets: globe d=14, agents d=7.5, leaves d=2.8 (per HYPHA spec)
// Lerp 0.07 per frame toward target; wheel rebound snaps to nearest preset.
// Click agent → 'agents' preset; click leaf → 'leaves' preset;
// Double-click empty space → 'globe' preset. Escape returns to globe.
// ════════════════════════════════════════════════════════════════════════════════

// ────────── Zoom Preset Configuration ──────────
const ZOOM_PRESETS = {
  globe:  { distance: 14,   label: 'globe',  index: 0 },
  agents: { distance: 7.5,  label: 'agents', index: 1 },
  leaves: { distance: 2.8,  label: 'leaves', index: 2 }
};
const ZOOM_LEVELS = ['globe', 'agents', 'leaves'];
const ZOOM_LERP_FACTOR = 0.07;  // per-frame lerp toward target (per HYPHA spec)

// ────────── Zoom State ──────────
let currentZoomPreset = 'globe';
let zoomDistanceTarget = ZOOM_PRESETS.globe.distance;
let zoomDistanceCurrent = ZOOM_PRESETS.globe.distance;

// Focus target — module-local ref, dispatched via CustomEvent for dashboard-console
// null = no focus; { type: 'agent'|'leaf', id: string, agentId?: string }
let focusTarget = null;
let focusPosition = new THREE.Vector3(0, 0, 0); // Lerp target for camera lookAt

// ────────── Zoom Preset Controller ──────────
function setZoomPreset(presetName, options = {}) {
  const preset = ZOOM_PRESETS[presetName];
  if (!preset) return;

  currentZoomPreset = presetName;
  zoomDistanceTarget = preset.distance;

  // Dispatch event for dashboard-console to update zoom readout (if present)
  document.dispatchEvent(new CustomEvent('dashboard:zoom-change', {
    detail: { preset: presetName, distance: preset.distance }
  }));
}

function getZoomPresetIndex() {
  return ZOOM_PRESETS[currentZoomPreset]?.index || 0;
}

// ────────── Nearest Preset Calculator ──────────
// Used for wheel rebound: finds the closest preset to current zoom distance
function findNearestPreset(distance) {
  // Threshold midpoints between presets
  const agentsLeavesThreshold = (ZOOM_PRESETS.agents.distance + ZOOM_PRESETS.leaves.distance) / 2;
  const globeAgentsThreshold = (ZOOM_PRESETS.globe.distance + ZOOM_PRESETS.agents.distance) / 2;

  if (distance < agentsLeavesThreshold) return 'leaves';
  if (distance < globeAgentsThreshold) return 'agents';
  return 'globe';
}

// ────────── Wheel Zoom Handler (Custom, Rebound to Preset) ──────────
// OrbitControls zoom is disabled (controls.enableZoom = false in scaffold)
// This handler manages wheel zoom with rebound to nearest preset on release.
let wheelReboundTimeout = null;
const WHEEL_REBOUND_DELAY = 220; // ms after wheel stops before snapping to preset

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();

  // Adjust target distance based on scroll delta
  // Scale factor 0.015 matches v9.4 feel
  zoomDistanceTarget = Math.max(1.5, Math.min(28, zoomDistanceTarget + e.deltaY * 0.015));

  // Find nearest preset for readout update (but don't snap yet)
  const nearest = findNearestPreset(zoomDistanceTarget);
  if (nearest !== currentZoomPreset) {
    currentZoomPreset = nearest;
    // Dispatch interim readout update
    document.dispatchEvent(new CustomEvent('dashboard:zoom-change', {
      detail: { preset: nearest, distance: zoomDistanceTarget, interim: true }
    }));
  }

  // Clear any pending rebound, set new one
  if (wheelReboundTimeout) clearTimeout(wheelReboundTimeout);
  wheelReboundTimeout = setTimeout(() => {
    // Rebound: snap to the nearest preset
    const snapTo = findNearestPreset(zoomDistanceCurrent);
    setZoomPreset(snapTo);
  }, WHEEL_REBOUND_DELAY);
}, { passive: false });

// ────────── Focus Target Controller ──────────
// Click on agent → preset 'agents'; click on leaf → preset 'leaves'
// Double-click empty space → preset 'globe'

function setFocusTarget(target) {
  focusTarget = target;

  if (!target) {
    // Unfocus: return to origin
    focusPosition.set(0, 0, 0);
    document.dispatchEvent(new CustomEvent('dashboard:focus-change', {
      detail: { target: null }
    }));
    return;
  }

  if (target.type === 'agent') {
    const agentData = agentGlobeData.get(target.id);
    if (agentData) {
      focusPosition.copy(agentData.position);
    }
    setZoomPreset('agents');
  } else if (target.type === 'leaf') {
    // Leaf focus: zoom to leaves level
    // Position comes from leafMeshData (set by dashboard.canvas.leaves-and-micros)
    const leafData = window.__DASHBOARD_CANVAS__?.leafMeshData?.get(target.id);
    if (leafData) {
      const parentAgent = agentGlobeData.get(leafData.parentAgentId);
      if (parentAgent) {
        focusPosition.copy(leafData.position).add(parentAgent.position);
      }
    } else if (target.agentId) {
      // Fallback: focus on the parent agent's position
      const agentData = agentGlobeData.get(target.agentId);
      if (agentData) {
        focusPosition.copy(agentData.position);
      }
    }
    setZoomPreset('leaves');
  }

  // Dispatch focus change event for dashboard-console
  document.dispatchEvent(new CustomEvent('dashboard:focus-change', {
    detail: { target }
  }));
}

// ────────── Raycaster for Click Detection ──────────
const raycaster = new THREE.Raycaster();
raycaster.params.Mesh = { threshold: 0.05 };
const pointerNDC = new THREE.Vector2();

// Build hit targets from agent globe data (central pips are clickable)
function getAgentHitTargets() {
  const targets = [];
  agentGlobeData.forEach((data, agentId) => {
    // Each Bloch ring group has a central pip (SphereGeometry) — last child
    const children = data.group.children;
    const pip = children[children.length - 1]; // Central pip sphere
    if (pip && pip.isMesh) {
      pip.userData = { kind: 'agent', agentId: agentId };
      targets.push(pip);
    }
  });
  return targets;
}

// Build hit targets from leaf mesh data (if available)
function getLeafHitTargets() {
  const targets = [];
  const leafData = window.__DASHBOARD_CANVAS__?.leafMeshData;
  if (!leafData) return targets;

  leafData.forEach((lData, leafId) => {
    // Leaf meshes have a fill sphere that's good for hit testing
    if (lData.fillMesh && lData.fillMesh.isMesh) {
      lData.fillMesh.userData = {
        kind: 'leaf',
        leafId: leafId,
        agentId: lData.parentAgentId
      };
      targets.push(lData.fillMesh);
    }
  });
  return targets;
}

// Pointer tracking for click detection
let pointerDownPos = null;
let lastClickTime = 0;
const DOUBLE_CLICK_THRESHOLD = 350; // ms

renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;

  const dx = e.clientX - pointerDownPos.x;
  const dy = e.clientY - pointerDownPos.y;
  const moved = Math.sqrt(dx * dx + dy * dy);
  pointerDownPos = null;

  // If dragged more than 4px, it's a drag, not a click
  if (moved > 4) return;

  // Update NDC for raycaster
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = ((e.clientY - rect.top) / rect.height) * -2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);

  // Check for leaf hits first (only when zoomed in enough)
  let hit = null;
  if (zoomDistanceCurrent < 10) {
    const leafTargets = getLeafHitTargets();
    const leafHits = raycaster.intersectObjects(leafTargets, false);
    if (leafHits.length > 0) {
      hit = leafHits[0].object.userData;
    }
  }

  // Then check for agent hits
  if (!hit) {
    const agentTargets = getAgentHitTargets();
    const agentHits = raycaster.intersectObjects(agentTargets, false);
    if (agentHits.length > 0) {
      hit = agentHits[0].object.userData;
    }
  }

  const now = performance.now();
  const isDoubleClick = (now - lastClickTime) < DOUBLE_CLICK_THRESHOLD;
  lastClickTime = now;

  if (hit) {
    if (hit.kind === 'leaf') {
      // Click on leaf → focus and zoom to 'leaves' preset
      setFocusTarget({ type: 'leaf', id: hit.leafId, agentId: hit.agentId });
    } else if (hit.kind === 'agent') {
      // Single click on agent → focus and zoom to 'agents' preset
      setFocusTarget({ type: 'agent', id: hit.agentId });
    }
  } else if (isDoubleClick) {
    // Double-click on empty space → return to globe view, clear focus
    setFocusTarget(null);
    setZoomPreset('globe');
  }
});

// Escape key clears focus and returns to globe
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    setFocusTarget(null);
    setZoomPreset('globe');
  }
});

// ────────── Zoom Animation (per-frame lerp) ──────────
// Integrates into the main animation loop via animationHooks
function animateAdaptiveZoom(t) {
  // Lerp current distance toward target (0.07 per frame, per HYPHA spec)
  zoomDistanceCurrent += (zoomDistanceTarget - zoomDistanceCurrent) * ZOOM_LERP_FACTOR;

  // Lerp controls.target toward focusPosition (smooth camera panning)
  controls.target.lerp(focusPosition, 0.06);

  // Maintain camera distance from controls.target
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).add(dir.multiplyScalar(zoomDistanceCurrent));
}

// Register zoom animation hook
animationHooks.push(animateAdaptiveZoom);

// ────────── Export Agent Globe Data for Other Leaves ──────────
// Other leaves (leaves-and-micros, multiverse, hud-overlays, etc.)

// ────────── Exports for other canvas leaves ──────────
// Other dashboard.canvas.* leaves will import/access these via window
window.__DASHBOARD_CANVAS__ = {
  scene,
  camera,
  renderer,
  controls,
  mainGroup,
  GLOBE_R,
  STATE,
  THEME,
  THREE,
  // Animation hook registry — other canvas leaves register here
  animationHooks,
  // Agent globe exports
  agentGlobeData,
  fibonacciSpherePosition,
  makeBlochRings,
  getBrightnessForState,
  modulateColor,
  TAU,
  PHI,
  // Cache relay exports (dashboard.canvas.cache-relays)
  cacheRelayGroup,
  cacheRelays,
  cacheRelayEdges,
  cacheRelayMesh,
  CACHE_RELAY_RADIUS,
  CACHE_RELAY_COLOR_HEX,
  CACHE_RELAY_COLOR,
  // Pulse exports (dashboard.canvas.pulses)
  routingEdges,
  activePackets,
  spawnPacket,
  relayDimUntil,
  ROUTING_PACKET_DURATION,
  CACHE_PULSE_DURATION,
  DASHFLOW_DURATION,
  RELAY_DIM_DURATION,
  // Adaptive zoom exports (dashboard.canvas.adaptive-zoom)
  ZOOM_PRESETS,
  ZOOM_LEVELS,
  ZOOM_LERP_FACTOR,
  setZoomPreset,
  getZoomPresetIndex,
  findNearestPreset,
  setFocusTarget,
  focusTarget: () => focusTarget,
  focusPosition,
  zoomDistanceCurrent: () => zoomDistanceCurrent,
  zoomDistanceTarget: () => zoomDistanceTarget,
  currentZoomPreset: () => currentZoomPreset,
  raycaster,
  getAgentHitTargets,
  getLeafHitTargets
};

// ════════════════════════════════════════════════════════════════════════════════
// HUD OVERLAYS — targeting reticle, scan beam, depth readout (focus-conditional)
// Scope: dashboard.canvas.hud-overlays
// Consumes: camera, renderer, agentGlobeData, focusTarget, currentZoomPreset
//
// Targeting reticle: 4 corner brackets that converge on the focused agent.
// Scan beam: vertical sweep during dive transitions (zoom preset changes).
// Depth HUD: agent.id + state + iter readout — updates on focus change only.
// ════════════════════════════════════════════════════════════════════════════════

// ────────── HUD DOM Elements ──────────
const hudReticle = document.getElementById('target-reticle');
const hudReticleLbl = document.getElementById('reticle-lbl');
const hudScanbeam = document.getElementById('scanbeam');
const hudDepth = document.getElementById('depth-hud');
const hudDepthTarget = document.getElementById('depth-target');
const hudDepthState = document.getElementById('depth-state');
const hudDepthIter = document.getElementById('depth-iter');
const hudDepthLock = document.getElementById('depth-lock');

// ────────── HUD State ──────────
let hudPrevZoomPreset = currentZoomPreset;
let hudFocusEngageProgress = 0;  // 0 = unfocused, 1 = fully locked
const HUD_ENGAGE_RATE = 0.0104;  // progress per frame (1.6s to fully engage at 60fps: 1/(60*1.6)≈0.0104)

// ────────── Scan Beam Trigger ──────────
// Triggered on dive transitions (zoom preset change from globe→agents or agents→leaves)
function triggerScanBeam() {
  if (!hudScanbeam) return;
  // Reset and restart animation (reflow trick to restart CSS animation)
  hudScanbeam.classList.remove('run');
  void hudScanbeam.offsetWidth; // Force reflow
  hudScanbeam.classList.add('run');
}

// Listen for zoom preset changes dispatched by adaptive-zoom
document.addEventListener('dashboard:zoom-change', (e) => {
  const newPreset = e.detail?.preset;
  if (!newPreset) return;

  // Trigger scan beam on dive transitions (zooming in)
  const isDive = (
    (hudPrevZoomPreset === 'globe' && newPreset === 'agents') ||
    (hudPrevZoomPreset === 'agents' && newPreset === 'leaves') ||
    (hudPrevZoomPreset === 'globe' && newPreset === 'leaves')
  );

  if (isDive && !e.detail?.interim) {
    triggerScanBeam();
  }

  hudPrevZoomPreset = newPreset;
});

// ────────── Depth HUD Update ──────────
// Called when focus target changes — updates the depth readout (not per-frame)
function updateDepthHud(target) {
  if (!hudDepth) return;

  if (!target) {
    // No focus: hide depth HUD
    hudDepth.classList.remove('show');
    return;
  }

  // Find agent data
  let agentId = null;
  let agentState = '—';
  let iter = STATE.organism?.iter || 0;

  if (target.type === 'agent') {
    agentId = target.id;
    // Find agent state from STATE.agents
    const agent = STATE.agents?.find(a => a.id === agentId);
    if (agent) {
      agentState = agent.state || 'pending';
    }
  } else if (target.type === 'leaf') {
    agentId = target.agentId || target.id;
    // Find leaf state
    const parentAgent = STATE.agents?.find(a => a.id === target.agentId);
    if (parentAgent) {
      const leaf = parentAgent.leaves?.find(l => l.id === target.id);
      if (leaf) {
        agentState = leaf.state || 'pending';
      }
    }
  }

  // Update depth HUD elements
  if (hudDepthTarget) hudDepthTarget.textContent = agentId || '—';
  if (hudDepthState) hudDepthState.textContent = agentState;
  if (hudDepthIter) hudDepthIter.textContent = iter;
  if (hudDepthLock) hudDepthLock.textContent = agentId || '—';

  // Show depth HUD
  hudDepth.classList.add('show');
}

// Listen for focus changes dispatched by adaptive-zoom
document.addEventListener('dashboard:focus-change', (e) => {
  const target = e.detail?.target;
  updateDepthHud(target);

  // Reset engage progress when focus changes
  if (!target) {
    hudFocusEngageProgress = 0;
  }
});

// ────────── Targeting Reticle Animation ──────────
// Per-frame update: projects focused agent to screen space, positions reticle
function animateHudOverlays(t) {
  const ft = focusTarget;  // Current focus target

  if (!ft || !hudReticle) {
    // No focus: hide reticle, reset progress
    if (hudReticle) hudReticle.classList.remove('lock');
    hudFocusEngageProgress = Math.max(0, hudFocusEngageProgress - HUD_ENGAGE_RATE * 2);
    return;
  }

  // Advance engage progress (smoothly approaches 1.0)
  hudFocusEngageProgress = Math.min(1, hudFocusEngageProgress + HUD_ENGAGE_RATE);

  // Get 3D position of focused target
  let worldPos = null;

  if (ft.type === 'agent') {
    const agentData = agentGlobeData.get(ft.id);
    if (agentData) {
      worldPos = agentData.position.clone();
    }
  } else if (ft.type === 'leaf') {
    // Leaf position: try leafMeshData first, then fall back to parent agent
    const leafData = window.__DASHBOARD_CANVAS__?.leafMeshData?.get(ft.id);
    if (leafData) {
      const parentAgent = agentGlobeData.get(leafData.parentAgentId);
      if (parentAgent) {
        worldPos = leafData.position.clone().add(parentAgent.position);
      }
    }
    if (!worldPos && ft.agentId) {
      const parentAgent = agentGlobeData.get(ft.agentId);
      if (parentAgent) {
        worldPos = parentAgent.position.clone();
      }
    }
  }

  if (!worldPos) {
    hudReticle.classList.remove('lock');
    return;
  }

  // Project 3D position to screen space
  const projected = worldPos.clone();
  projected.project(camera);

  const rect = renderer.domElement.getBoundingClientRect();
  const screenX = (projected.x * 0.5 + 0.5) * rect.width;
  const screenY = (-projected.y * 0.5 + 0.5) * rect.height;

  // Reticle size: converges from 220px to 80px as engage progress increases (1.6s animation)
  const maxSize = 220;
  const minSize = 80;
  const size = maxSize - (maxSize - minSize) * hudFocusEngageProgress;

  // Position reticle centered on projected point
  hudReticle.style.left = (screenX - size / 2) + 'px';
  hudReticle.style.top = (screenY - size / 2) + 'px';
  hudReticle.style.width = size + 'px';
  hudReticle.style.height = size + 'px';

  // Show reticle (lock class) when engage progress > 0.15
  hudReticle.classList.toggle('lock', hudFocusEngageProgress > 0.15);

  // Update reticle label
  if (hudReticleLbl) {
    const targetLabel = ft.type === 'agent' ? ft.id : (ft.agentId || ft.id);
    hudReticleLbl.textContent = `lock · ${targetLabel}`;
  }
}

// Register HUD overlay animation hook
animationHooks.push(animateHudOverlays);

// ────────── Export HUD Overlay Functions ──────────
// Add to the existing __DASHBOARD_CANVAS__ exports
window.__DASHBOARD_CANVAS__.triggerScanBeam = triggerScanBeam;
window.__DASHBOARD_CANVAS__.updateDepthHud = updateDepthHud;
window.__DASHBOARD_CANVAS__.hudFocusEngageProgress = () => hudFocusEngageProgress;

// ────────── Cleanup on page unload ──────────
window.addEventListener('beforeunload', () => {
  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
  }
  renderer.dispose();
});

</script>
