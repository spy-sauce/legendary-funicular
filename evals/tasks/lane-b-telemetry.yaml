# Mycelium Framework — VibeSpace LLC — The network provides.
#
# lane-b-telemetry — capability task. One leaf writes a self-contained JSONL
# telemetry emitter (plain TS, zero framework imports) against a frozen
# envelope contract. Schema: cli/src/lib/eval/types.ts.

id: lane-b-telemetry
description: Capability — leaf writes a self-contained telemetry-emitter.ts appending JSONL event envelopes
lane: B
fixture:
  hypha: evals/fixtures/lane-b-telemetry/HYPHA.md
  nutrients: evals/fixtures/lane-b-telemetry/NUTRIENTS.md
  scope: telemetry-emitter.ts
runs: 3
budget:
  max_usd: 0.75 # per trial
  max_wall_sec: 600
judge:
  # Event kinds from the frozen contract appear in the source (union/constants).
  - type: grep
    pattern: leaf_started|leaf_fruited|cost_recorded
    files: telemetry-emitter.ts
    min_matches: 2
  # JSONL lines must be serialized, not hand-concatenated.
  - type: grep
    pattern: JSON\.stringify
    files: telemetry-emitter.ts
  # Substance floor: a real emitter (types + append + emit) is not 10 lines.
  - type: command
    run: test "$(wc -l < telemetry-emitter.ts)" -ge 40
gates:
  # Capability bar per spec targets: at least one of k trials must pass.
  pass_at_k: 1.0
pinned_commit: 22351c3 # provenance — authored against this SHA; eval runs the CURRENT built CLI
