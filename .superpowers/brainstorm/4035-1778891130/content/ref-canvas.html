<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Mycelium Network — Agent Management</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bloom-green: #00FFB2;
  --bg-deep: #060610;
  --bg-surface: #0E0E18;
  --text-primary: #E8E8F0;
  --text-secondary: #8888A0;
  --text-dim: #444460;
  --border: #1A1A2A;
  --node-audio: #FF6B6B;
  --node-ai: #A78BFA;
  --node-chain: #4ECDC4;
  --node-social: #FFB347;
  --node-storage: #FF69B4;
  --node-core: #00FFB2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Sora', sans-serif;
  overflow: hidden;
  height: 100vh;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 28px;
  height: 28px;
  background: var(--bloom-green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--bg-deep);
}

.title {
  font-size: 15px;
  font-weight: 600;
}

.title span { color: var(--bloom-green); }

.subtitle {
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

.legend {
  display: flex;
  gap: 16px;
  align-items: center;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-secondary);
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.stats {
  display: flex;
  gap: 20px;
}

.stat {
  text-align: right;
}

.stat-value {
  font-size: 16px;
  font-weight: 600;
  color: var(--bloom-green);
  font-family: 'JetBrains Mono', monospace;
}

.stat-label {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

canvas {
  position: fixed;
  top: 56px;
  left: 0;
  width: 100%;
  height: calc(100% - 56px);
}

/* Node info panel */
.info-panel {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 320px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  z-index: 50;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  pointer-events: none;
}

.info-panel.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.info-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.info-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.info-name { font-size: 14px; font-weight: 600; }
.info-type { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

.info-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.info-stat {
  background: var(--bg-deep);
  border-radius: 6px;
  padding: 8px;
}

.info-stat-label {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.info-stat-value {
  font-size: 13px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.info-connections {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.info-connections span {
  display: inline-block;
  background: var(--bg-deep);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 10px;
  margin: 2px;
  font-family: 'JetBrains Mono', monospace;
}

/* Controls */
.controls {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 50;
}

.control-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.15s;
}

.control-btn:hover {
  border-color: var(--bloom-green);
  color: var(--bloom-green);
  background: #00FFB210;
}

/* Pulse animation overlay */
.pulse-ring {
  position: fixed;
  border-radius: 50%;
  border: 1px solid var(--bloom-green);
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">B</div>
    <div>
      <div class="title"><span>bloom</span> mycelium network</div>
      <div class="subtitle">agent orchestration layer</div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-core);box-shadow:0 0 8px var(--node-core);"></div> Core</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-ai);"></div> AI Agent</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-audio);"></div> Audio</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-chain);"></div> Web3</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-social);"></div> Social</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--node-storage);"></div> Storage</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="activeAgents">12</div>
      <div class="stat-label">Active Agents</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="msgRate">847/s</div>
      <div class="stat-label">Msg Throughput</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="latency">2.1ms</div>
      <div class="stat-label">Avg Latency</div>
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<div class="info-panel" id="infoPanel">
  <div class="info-header">
    <div class="info-icon" id="infoIcon">🧠</div>
    <div>
      <div class="info-name" id="infoName">Agent Name</div>
      <div class="info-type" id="infoType">TYPE / ROLE</div>
    </div>
  </div>
  <div class="info-stats">
    <div class="info-stat">
      <div class="info-stat-label">Uptime</div>
      <div class="info-stat-value" id="infoUptime" style="color:var(--bloom-green);">99.9%</div>
    </div>
    <div class="info-stat">
      <div class="info-stat-label">Messages</div>
      <div class="info-stat-value" id="infoMsgs" style="color:var(--node-ai);">12.4K</div>
    </div>
    <div class="info-stat">
      <div class="info-stat-label">Load</div>
      <div class="info-stat-value" id="infoLoad" style="color:var(--node-audio);">34%</div>
    </div>
    <div class="info-stat">
      <div class="info-stat-label">Latency</div>
      <div class="info-stat-value" id="infoLatency" style="color:var(--node-chain);">1.2ms</div>
    </div>
  </div>
  <div class="info-connections" id="infoConnections">
    Connected to: <span>agent-1</span> <span>agent-2</span>
  </div>
</div>

<div class="controls">
  <button class="control-btn" onclick="togglePulse()" title="Toggle data pulse">◉</button>
  <button class="control-btn" onclick="resetView()" title="Reset view">⟲</button>
  <button class="control-btn" onclick="toggleLabels()" title="Toggle labels">T</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight - 56;
}
resize();
window.addEventListener('resize', resize);

// ===== NODE DEFINITIONS =====
// The mycelium network: a central "spore" (Bloom Core) with radiating hyphae
const nodeTypes = {
  core: { color: '#00FFB2', glow: '#00FFB260', icon: '🌱', size: 32 },
  ai: { color: '#A78BFA', glow: '#A78BFA40', icon: '🧠', size: 22 },
  audio: { color: '#FF6B6B', glow: '#FF6B6B40', icon: '🎵', size: 20 },
  chain: { color: '#4ECDC4', glow: '#4ECDC440', icon: '⛓', size: 20 },
  social: { color: '#FFB347', glow: '#FFB34740', icon: '🤝', size: 20 },
  storage: { color: '#FF69B4', glow: '#FF69B440', icon: '💾', size: 18 },
};

const nodes = [
  // Core
  { id: 'bloom-core', label: 'Bloom Core', type: 'core', desc: 'ORCHESTRATOR', x: 0, y: 0, 
    uptime: '99.99%', msgs: '142K', load: '18%', latency: '0.4ms',
    connections: ['ai-discovery', 'ai-recommend', 'ai-moderate', 'chain-mint', 'audio-engine'] },
  
  // AI Agents
  { id: 'ai-discovery', label: 'Discovery Agent', type: 'ai', desc: 'CONTENT RANKING', x: -200, y: -140,
    uptime: '99.8%', msgs: '45K', load: '62%', latency: '2.1ms',
    connections: ['bloom-core', 'ai-recommend', 'social-feed', 'storage-index'] },
  { id: 'ai-recommend', label: 'Recommend Agent', type: 'ai', desc: 'PERSONALIZATION', x: 180, y: -160,
    uptime: '99.7%', msgs: '38K', load: '55%', latency: '1.8ms',
    connections: ['bloom-core', 'ai-discovery', 'social-profile'] },
  { id: 'ai-moderate', label: 'Moderation Agent', type: 'ai', desc: 'CONTENT SAFETY', x: -280, y: 60,
    uptime: '99.95%', msgs: '67K', load: '41%', latency: '0.9ms',
    connections: ['bloom-core', 'social-feed', 'storage-content'] },
  { id: 'ai-compose', label: 'Compose Agent', type: 'ai', desc: 'AI MUSIC GEN', x: 300, y: 40,
    uptime: '98.5%', msgs: '12K', load: '78%', latency: '5.4ms',
    connections: ['audio-engine', 'audio-fx', 'storage-samples'] },
  
  // Audio Agents
  { id: 'audio-engine', label: 'Audio Engine', type: 'audio', desc: 'DSP PIPELINE', x: 120, y: 100,
    uptime: '99.9%', msgs: '89K', load: '45%', latency: '1.1ms',
    connections: ['bloom-core', 'ai-compose', 'audio-fx', 'audio-stream'] },
  { id: 'audio-fx', label: 'FX Processor', type: 'audio', desc: 'EFFECTS CHAIN', x: 260, y: 180,
    uptime: '99.8%', msgs: '34K', load: '52%', latency: '2.3ms',
    connections: ['audio-engine', 'ai-compose'] },
  { id: 'audio-stream', label: 'Stream Agent', type: 'audio', desc: 'LIVE OUTPUT', x: -60, y: 200,
    uptime: '99.6%', msgs: '156K', load: '38%', latency: '3.1ms',
    connections: ['audio-engine', 'chain-royalty'] },
  
  // Web3 Agents
  { id: 'chain-mint', label: 'Mint Agent', type: 'chain', desc: 'NFT MINTING', x: -180, y: -30,
    uptime: '99.4%', msgs: '8K', load: '22%', latency: '4.2ms',
    connections: ['bloom-core', 'chain-royalty', 'storage-ipfs'] },
  { id: 'chain-royalty', label: 'Royalty Agent', type: 'chain', desc: 'SPLIT ENGINE', x: -120, y: 160,
    uptime: '99.5%', msgs: '5K', load: '15%', latency: '3.8ms',
    connections: ['chain-mint', 'audio-stream'] },
  
  // Social Agents  
  { id: 'social-feed', label: 'Feed Agent', type: 'social', desc: 'CONTENT DELIVERY', x: -340, y: -80,
    uptime: '99.7%', msgs: '92K', load: '48%', latency: '1.5ms',
    connections: ['ai-discovery', 'ai-moderate'] },
  { id: 'social-profile', label: 'Profile Agent', type: 'social', desc: 'IDENTITY MANAGER', x: 320, y: -100,
    uptime: '99.9%', msgs: '28K', load: '25%', latency: '1.1ms',
    connections: ['ai-recommend', 'storage-content'] },
  
  // Storage Agents
  { id: 'storage-index', label: 'Index Agent', type: 'storage', desc: 'SEARCH INDEX', x: -360, y: -200,
    uptime: '99.8%', msgs: '55K', load: '67%', latency: '0.8ms',
    connections: ['ai-discovery'] },
  { id: 'storage-content', label: 'Content Store', type: 'storage', desc: 'BLOB STORAGE', x: 380, y: -30,
    uptime: '99.95%', msgs: '71K', load: '42%', latency: '1.9ms',
    connections: ['ai-moderate', 'social-profile'] },
  { id: 'storage-samples', label: 'Sample Vault', type: 'storage', desc: 'AUDIO ASSETS', x: 400, y: 160,
    uptime: '99.9%', msgs: '18K', load: '31%', latency: '2.5ms',
    connections: ['ai-compose'] },
  { id: 'storage-ipfs', label: 'IPFS Bridge', type: 'storage', desc: 'DECENTRALIZED', x: -300, y: 180,
    uptime: '98.8%', msgs: '4K', load: '19%', latency: '8.2ms',
    connections: ['chain-mint'] },
];

// Center everything
const cx = W / 2;
const cy = H / 2;
nodes.forEach(n => {
  n.x += cx;
  n.y += cy;
  n.ox = n.x;
  n.oy = n.y;
  n.vx = 0;
  n.vy = 0;
  n.pulsePhase = Math.random() * Math.PI * 2;
});

// Build connection pairs
const connections = [];
nodes.forEach(n => {
  n.connections.forEach(targetId => {
    const target = nodes.find(t => t.id === targetId);
    if (target && !connections.find(c => 
      (c.from === n.id && c.to === targetId) || (c.from === targetId && c.to === n.id)
    )) {
      connections.push({ from: n.id, to: targetId });
    }
  });
});

// Data packets traveling along connections
let packets = [];
let showPulse = true;
let showLabels = true;

function spawnPacket() {
  if (!showPulse) return;
  const conn = connections[Math.floor(Math.random() * connections.length)];
  const reverse = Math.random() > 0.5;
  packets.push({
    from: reverse ? conn.to : conn.from,
    to: reverse ? conn.from : conn.to,
    t: 0,
    speed: 0.005 + Math.random() * 0.015,
  });
}

// Mouse interaction
let hoveredNode = null;
let mouseX = 0, mouseY = 0;

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY - 56;
  
  hoveredNode = null;
  nodes.forEach(n => {
    const dx = mouseX - n.x;
    const dy = mouseY - n.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nt = nodeTypes[n.type];
    if (dist < nt.size + 10) {
      hoveredNode = n;
    }
  });
  
  const panel = document.getElementById('infoPanel');
  if (hoveredNode) {
    const nt = nodeTypes[hoveredNode.type];
    document.getElementById('infoIcon').style.background = nt.glow;
    document.getElementById('infoIcon').textContent = nt.icon;
    document.getElementById('infoName').textContent = hoveredNode.label;
    document.getElementById('infoName').style.color = nt.color;
    document.getElementById('infoType').textContent = hoveredNode.desc;
    document.getElementById('infoUptime').textContent = hoveredNode.uptime;
    document.getElementById('infoMsgs').textContent = hoveredNode.msgs;
    document.getElementById('infoLoad').textContent = hoveredNode.load;
    document.getElementById('infoLatency').textContent = hoveredNode.latency;
    
    const connHtml = hoveredNode.connections.map(c => `<span>${c}</span>`).join(' ');
    document.getElementById('infoConnections').innerHTML = 'Connected to: ' + connHtml;
    
    panel.classList.add('visible');
    canvas.style.cursor = 'pointer';
  } else {
    panel.classList.remove('visible');
    canvas.style.cursor = 'default';
  }
});

// ===== RENDER LOOP =====
let frame = 0;

function draw() {
  frame++;
  ctx.clearRect(0, 0, W, H);
  
  // Background subtle grid
  ctx.strokeStyle = '#0A0A1A';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 60) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  // Gentle floating motion
  nodes.forEach(n => {
    n.x = n.ox + Math.sin(frame * 0.008 + n.pulsePhase) * 6;
    n.y = n.oy + Math.cos(frame * 0.006 + n.pulsePhase * 1.3) * 4;
  });
  
  // Draw connections (mycelium hyphae)
  connections.forEach(conn => {
    const from = nodes.find(n => n.id === conn.from);
    const to = nodes.find(n => n.id === conn.to);
    if (!from || !to) return;
    
    const isHovered = hoveredNode && 
      (hoveredNode.id === conn.from || hoveredNode.id === conn.to);
    
    // Organic curved connection
    const mx = (from.x + to.x) / 2 + Math.sin(frame * 0.01 + from.pulsePhase) * 15;
    const my = (from.y + to.y) / 2 + Math.cos(frame * 0.01 + to.pulsePhase) * 15;
    
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.quadraticCurveTo(mx, my, to.x, to.y);
    
    if (isHovered) {
      ctx.strokeStyle = '#00FFB260';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#00FFB240';
      ctx.shadowBlur = 8;
    } else {
      ctx.strokeStyle = '#1A1A3060';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Small "nutrient dots" along the hyphae
    if (showPulse) {
      const dotCount = 3;
      for (let i = 0; i < dotCount; i++) {
        const t = ((frame * 0.003 + i / dotCount + from.pulsePhase * 0.1) % 1);
        const px = from.x * (1-t)*(1-t) + mx * 2*t*(1-t) + to.x * t*t;
        const py = from.y * (1-t)*(1-t) + my * 2*t*(1-t) + to.y * t*t;
        
        ctx.beginPath();
        ctx.arc(px, py, isHovered ? 2 : 1, 0, Math.PI * 2);
        ctx.fillStyle = isHovered ? '#00FFB280' : '#00FFB230';
        ctx.fill();
      }
    }
  });
  
  // Draw data packets
  packets = packets.filter(p => p.t <= 1);
  packets.forEach(p => {
    p.t += p.speed;
    const from = nodes.find(n => n.id === p.from);
    const to = nodes.find(n => n.id === p.to);
    if (!from || !to) return;
    
    const mx = (from.x + to.x) / 2 + Math.sin(from.pulsePhase) * 15;
    const my = (from.y + to.y) / 2 + Math.cos(to.pulsePhase) * 15;
    const t = p.t;
    const px = from.x*(1-t)*(1-t) + mx*2*t*(1-t) + to.x*t*t;
    const py = from.y*(1-t)*(1-t) + my*2*t*(1-t) + to.y*t*t;
    
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#00FFB2';
    ctx.shadowColor = '#00FFB2';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Spawn packets periodically
  if (frame % 8 === 0) spawnPacket();
  
  // Draw nodes
  nodes.forEach(n => {
    const nt = nodeTypes[n.type];
    const isHovered = hoveredNode === n;
    const pulse = Math.sin(frame * 0.03 + n.pulsePhase) * 0.15 + 1;
    const size = nt.size * (isHovered ? 1.3 : pulse);
    
    // Outer glow
    if (n.type === 'core' || isHovered) {
      const grad = ctx.createRadialGradient(n.x, n.y, size * 0.5, n.x, n.y, size * 3);
      grad.addColorStop(0, nt.glow);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(n.x, n.y, size * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Node body
    ctx.beginPath();
    ctx.arc(n.x, n.y, size, 0, Math.PI * 2);
    ctx.fillStyle = isHovered ? nt.color + '40' : nt.color + '20';
    ctx.fill();
    ctx.strokeStyle = isHovered ? nt.color : nt.color + '80';
    ctx.lineWidth = isHovered ? 2.5 : 1.5;
    ctx.stroke();
    
    // Inner dot
    ctx.beginPath();
    ctx.arc(n.x, n.y, size * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = nt.color;
    ctx.fill();
    
    // Label
    if (showLabels) {
      ctx.font = `${isHovered ? '600' : '500'} ${isHovered ? 12 : 10}px Sora`;
      ctx.fillStyle = isHovered ? '#fff' : '#888';
      ctx.textAlign = 'center';
      ctx.fillText(n.label, n.x, n.y + size + 16);
      
      if (isHovered) {
        ctx.font = '400 9px "JetBrains Mono"';
        ctx.fillStyle = nt.color;
        ctx.fillText(n.desc, n.x, n.y + size + 28);
      }
    }
  });
  
  requestAnimationFrame(draw);
}

draw();

// Controls
function togglePulse() { showPulse = !showPulse; }
function toggleLabels() { showLabels = !showLabels; }
function resetView() {
  nodes.forEach(n => {
    n.ox = n.x;
    n.oy = n.y;
  });
}

// Update stats periodically
setInterval(() => {
  const rate = 800 + Math.floor(Math.random() * 100);
  document.getElementById('msgRate').textContent = rate + '/s';
  const lat = (1.8 + Math.random() * 0.8).toFixed(1);
  document.getElementById('latency').textContent = lat + 'ms';
}, 2000);
</script>
</body>
</html>
