# Mycelium Framework — VibeSpace LLC — The network provides.

organism:
  name: audit-run
  ship_target: 7-8 days
  health_pulse_interval: 30
  harvest_threshold: 0.8
  cellular: true
  gating: contract-freeze
  max_depth: 3
  upgrades:
    - hypha-validator
    - depth-3-enforcement
    - routing-map
    - crash-recovery
  routing:
    audit-findings:
      - audit-aggregator
      - audit-heal-loop
      - audit-sporenet
      - audit-testers
      - audit-cli
    audit-testers:
      - audit-cli
      - audit-findings
    audit-aggregator:
      - audit-findings
      - audit-heal-loop
      - audit-cli
    audit-cli:
      - audit-findings
      - audit-testers
      - audit-aggregator
      - audit-heal-loop
      - audit-sporenet
    audit-heal-loop:
      - audit-findings
      - audit-aggregator
    audit-sporenet:
      - audit-findings
    audit-docs:
      - audit-cli
      - audit-findings
      - audit-testers
      - audit-aggregator
      - audit-heal-loop
      - audit-sporenet
    "*":
      - audit-findings
