agents:
  - id: audit-findings
    scope: Finding type + JSONL writer + SHA dedupe + severity validation
    branch: feat/audit-findings
    blocked_by: []
    blocks:
      - audit-aggregator
      - audit-heal-loop
      - audit-sporenet
      - audit-testers
      - audit-cli
    capabilities:
      - typescript
      - jsonl
    sub_agents:
      - id: audit.findings.type
        scope: Finding interface + Severity union in cli/src/lib/audit/findings.ts per
          NUTRIENTS §1
      - id: audit.findings.writer
        scope: appendFinding + readFindings + dedupe by id (sha256); atomic append;
          never throw
      - id: audit.findings.validate
        scope: validateFinding runtime guard (severity union, id length, ISO-8601 ts)
  - id: audit-testers
    scope: Tester registry, HYPHA-TEST-*.md loader, tester runner pool
    branch: feat/audit-testers
    blocked_by: []
    blocks:
      - audit-cli
    capabilities:
      - typescript
      - markdown-parsing
      - claude-agent-sdk
    sub_agents:
      - id: audit.testers.types
        scope: TesterDef interface + TesterResult interface in
          cli/src/lib/audit/testers.ts per NUTRIENTS §4
      - id: audit.testers.loader
        scope: loadTesters scans hyphae/HYPHA-TEST-*.md; parses CACHE HEADER per
          NUTRIENTS §6; throws on malformed
      - id: audit.testers.runner
        scope: runTester spawns Claude Agent SDK session w/ Read+Bash tool budget;
          buildTesterPrompt mirrors the shape of buildLeafPrompt at
          cultivate.ts:771 (module-private — do not import)
      - id: audit.testers.pool
        scope: testers-pool.ts imports runWithConcurrency from the shared
          cli/src/lib/concurrency.ts (extracted pre-cultivation; cultivate.ts
          imports it too). Do NOT modify cultivate.ts.
      - id: audit.testers.examples
        scope: examples/hyphae-test/HYPHA-TEST-*.md stubs (tester.types, tester.tokens,
          tester.flow.talent) for loader validation
  - id: audit-aggregator
    scope: Group findings by biome, compose brief-fix.md, write summary.json
    branch: feat/audit-aggregator
    blocked_by: []
    blocks:
      - audit-heal-loop
      - audit-cli
    capabilities:
      - typescript
      - markdown-composition
    sub_agents:
      - id: audit.aggregator.aggregate
        scope: aggregate(findings) → AggregatedFindings — pure, deterministic ordering
          per NUTRIENTS §5
      - id: audit.aggregator.brief
        scope: composeBriefFix prepends only_biomes + Active findings + audit_baseline
          to brief.md
      - id: audit.aggregator.summary
        scope: writeSummary emits audit/<ts>/summary.json per NUTRIENTS §2
  - id: audit-cli
    scope: Commander wiring for mycelium audit-run + scaffold-tester subcommand
    branch: feat/audit-cli
    blocked_by: []
    blocks: []
    capabilities:
      - typescript
      - commander
    sub_agents:
      - id: audit.cli.command
        scope: cli/src/commands/audit-run.ts — Commander entry per NUTRIENTS §7 flag
          surface; registered in cli/src/index.ts
      - id: audit.cli.orchestrator
        scope: Wire loadTesters → runTestersInPool → aggregate → composeBriefFix →
          writeSummary; respect --only-tester, --concurrency, --against
      - id: audit.cli.scaffold
        scope: mycelium audit-run scaffold-tester <biome> subcommand — emits
          hyphae/HYPHA-TEST-<biome>.md stub from biome HYPHA
  - id: audit-heal-loop
    scope: Phase 2 — autofix re-plant cycle, iteration metadata, budget cap
    branch: feat/audit-heal-loop
    blocked_by: []
    blocks: []
    capabilities:
      - typescript
      - subprocess-spawn
    sub_agents:
      - id: audit.heal.loop
        scope: cli/src/lib/audit/heal-loop.ts — iterate spawn `mycelium cultivate
          --only-biome` per critical biome; terminate per NUTRIENTS §8
      - id: audit.heal.iteration
        scope: writeIteration persists IterationRecord under audit/<ts>/iterations/<n>/
          per NUTRIENTS §8
      - id: audit.heal.budget
        scope: Integrate lib/budget.ts — read --max-budget-usd → yaml budget.maxUsd →
          default; track cumulative_cost_usd
      - id: audit.heal.autofix-branch
        scope: --autofix-branch flag — sub-organism mode (default commit-on-top); per
          §10.5 lean
  - id: audit-sporenet
    scope: Phase 3 — sporenet/state.json audit block + serve renderer audit pane
    branch: feat/audit-sporenet
    blocked_by: []
    blocks: []
    capabilities:
      - typescript
      - html
    sub_agents:
      - id: audit.sporenet.state
        scope: cli/src/lib/audit/sporenet-integration.ts — writeAuditBlock atomic
          temp/rename per NUTRIENTS §3; drainAuditStateWrites
      - id: audit.sporenet.render
        scope: Extend sporenet serve / handler — render Audit pane below leaf grid via
          existing F5 re-read path; preserve all current renderHtml output
  - id: audit-docs
    scope: DEVELOPER_GUIDE.md audit-run section + tester HYPHA authoring runbook
    branch: feat/audit-docs
    blocked_by: []
    blocks: []
    capabilities:
      - documentation
    sub_agents:
      - id: audit.docs.guide
        scope: Append "Audit-Run" section to DEVELOPER_GUIDE.md — command surface,
          output layout, autofix loop, sporenet integration
      - id: audit.docs.runbook
        scope: docs/audit-run-tester-authoring.md — operator runbook for writing
          HYPHA-TEST-*.md (with scaffold-tester examples)
merge_order:
  - audit-findings
  - audit-testers
  - audit-aggregator
  - audit-heal-loop
  - audit-sporenet
  - audit-cli
  - audit-docs
timeline:
  parallel_phases:
    - hours: 0-2
      active:
        - audit-findings
        - audit-testers
        - audit-aggregator
        - audit-heal-loop
        - audit-sporenet
        - audit-cli
        - audit-docs
      description: All biomes germinate simultaneously under contract-freeze —
        NUTRIENTS.md §§1–10 are the only cross-biome surface.
budget:
  maxUsd: 75
